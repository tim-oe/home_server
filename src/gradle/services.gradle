tasks.register('deployService') {
    doLast {
        ssh.run {
            session(remotes.desktop) {
                executeSudo "mkdir -p /mnt/raid/services/${project.svc}"
                executeSudo "chown ansible:ansible /mnt/raid/services/${project.svc}"
                executeSudo "setfacl -m g:ansible:rwx /mnt/raid/services/${project.svc}"
                put from: "${project.rootDir}/src/services/${project.svc}", into: '/mnt/raid/services'
                put from: "${project.rootDir}/src/services/_common", into: "/mnt/raid/services/${project.svc}"
            }
        }
    }
}

tasks.register('deployGrafana', GradleBuild) {
    description = 'deploy grafana scripts and create backup dir'
    group = "deploy stuff"
    buildName = 'grafana'
    startParameter.projectProperties = ['svc':'grafana']
    tasks = ['deployService']
    doFirst {
        ssh.run {
            session(remotes.desktop) {
                executeSudo 'mkdir -p /mnt/backup/docker/grafana'
            }
        }
    }
}

