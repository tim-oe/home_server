/** 
 * can't nest GradleBuild tasks so use dependsOn to group
 * to call multiple GradleBuild tasks each thas has to have a unique buildName
 */
tasks.register('deployAll') {
    description = 'deploy all scripts scripts'
    group = "deploy stuff"
    dependsOn = ['deployVault',
        'deployJenkins',
        'deployGrafana',
        'deployNginx',
        'deployNexus',
        'deployOpenhab',
        'deployPortainer',
        'deployRabbitmq',
        'deployRedis',
        'deploySonarqube', 
        'deployUnifi',
        'deployUpsMon',
        'deployVault',
        'deployWeather',
        'deployWiki',
        'deployObsidian',
        'deployVelxio',
        'deployTimescaledb',
        'deployMariadb'
        ]
}
