/** 
 * can't nest GradleBuild tasks so use dependsOn to group
 * to call multiple GradleBuild tasks each thas has to have a unique buildName
 */
tasks.register('deployAll') {
    description = 'deploy all scripts scripts'
    group = "deploy stuff"
    dependsOn = ['deployVault',
        'deployJenkins',
        'deployGrafana',
        'deployNexus',
        'deployOpenhab',
        'deployPortainer',
        'deployRabbitmq',
        'deployRedis',
        'deploySonarqube',
        'deployUnifi',
        'deployUnifiOs',
        'deployUpsMon',
        'deployWiki',
        'deployObsidian',
        'deployVelxio',
        'deployTimescaledb',
        'deployGdrive',
        'deployGotify',
        'deployDiun',
        'deployTraefik',
        'deployPrometheus'
        ]
}
