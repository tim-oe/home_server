services:
  velxio:
    image: ghcr.io/davidmonterocrespo24/velxio:master
    container_name: velxio
    hostname: velxio
    restart: unless-stopped
    ports:
      - "3080:80"
    volumes:
      # image VOLUME paths; unnamed mounts become anonymous hashes
      - velxio-data:/app/data
      - velxio-arduino-libs:/root/.arduino15
      - velxio-arduino-user-libs:/root/Arduino
      - velxio-ccache:/var/cache/ccache
      - velxio-build:/var/lib/velxio-build
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    environment:
      - SECRET_KEY=${VELXIO_SECRET_KEY}
      - FRONTEND_URL=https://velxio.tecronin.uk
      - COOKIE_SECURE=true
    labels:
      # upstream only publishes master; digest in image: is the pin
      - diun.watch_repo=false
      - traefik.enable=true
      - traefik.http.routers.velxio.rule=Host(`velxio.tecronin.uk`)
      - traefik.http.routers.velxio.entrypoints=websecure
      - traefik.http.services.velxio.loadbalancer.server.port=80
      - traefik.http.middlewares.velxio-host.headers.customrequestheaders.Host=localhost
      - traefik.http.routers.velxio.middlewares=velxio-host
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  velxio-data:
    name: velxio-data
  velxio-arduino-libs:
    name: velxio-arduino-libs
  velxio-arduino-user-libs:
    name: velxio-arduino-user-libs
  velxio-ccache:
    name: velxio-ccache
  velxio-build:
    name: velxio-build

networks:
  default:
    external: true
    name: share-net
