server {
    listen 443 ssl;
    server_name velxio.tecronin.uk;

    location / {
        set $upstream velxio.share-net;
        proxy_pass http://$upstream:80;
        rewrite ^/(.*)$ /$1 break;

        # websocket support (used by the in-browser emulator)
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Upgrade $http_upgrade;

        # The container's internal nginx only matches server_name "localhost velxio.dev www.velxio.dev".
        # Forwarding the real Host header ($host) would miss all server blocks and return
        # the nginx welcome page. Overriding to "localhost" ensures the app's server block matches.
        proxy_set_header Host localhost;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_connect_timeout 2s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;
        proxy_next_upstream_tries 1;
        proxy_next_upstream_timeout 2s;

        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }
}
