# https://github.com/SuperioOne/nut_webgui
# https://www.jeffgeerling.com/blog/2025/nut-on-my-pi-so-my-servers-dont-die
services:
  nutwebdesktop:
    image: ghcr.io/superioone/nut_webgui:0.10.2
    restart: always
    hostname: "upsdesktop"
    container_name: "upsdesktop"
    ports:
      - 8010:8010
    environment:
      POLL_FREQ: "60"
      POLL_INTERVAL: "5"
      #UPSD_ADDR: "192.168.1.210"
      UPSD_ADDR: "tec-desktop.localdomain"
      UPSD_PORT: "3493"
      UPSD_USER: "admin"
      UPSD_PASS: "adm&pwd123"
      LISTEN: "0.0.0.0"
      PORT: "8010"
      LOG_LEVEL: "debug"
    labels:
      - traefik.enable=true
      - traefik.http.routers.upsdesktop.rule=Host(`upsdesktop.tecronin.uk`)
      - traefik.http.routers.upsdesktop.entrypoints=websecure
      - traefik.http.services.upsdesktop.loadbalancer.server.port=8010
  nutwebpimgr:
    image: ghcr.io/superioone/nut_webgui:0.10.2
    hostname: "upspimgr"
    container_name: "upspimgr"
    restart: always
    ports:
      - 8020:8020
    environment:
      POLL_FREQ: "60"
      POLL_INTERVAL: "5"
      #UPSD_ADDR: "192.168.1.43"
      UPSD_ADDR: "tec-pi-mgr.localdomain"
      UPSD_PORT: "3493"
      UPSD_USER: "admin"
      UPSD_PASS: "adm&pwd123"
      LISTEN: "0.0.0.0"
      PORT: "8020"
      LOG_LEVEL: "debug"
    labels:
      - traefik.enable=true
      - traefik.http.routers.upspimgr.rule=Host(`upspimgr.tecronin.uk`)
      - traefik.http.routers.upspimgr.entrypoints=websecure
      - traefik.http.services.upspimgr.loadbalancer.server.port=8020
networks:
  default:
    external: true
    name: "share-net"
