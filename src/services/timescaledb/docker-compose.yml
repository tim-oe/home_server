# https://hub.docker.com/r/timescale/timescaledb
---
services:
  timescaledb:
    image: timescale/timescaledb:2.18.0-pg17
    container_name: timescaledb
    hostname: timescaledb
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - /map-env.sh
      - POSTGRES_USER=TIMESCALEDB_USERNAME
      - POSTGRES_PASSWORD=TIMESCALEDB_PASSWORD
      - --
    command: ["docker-entrypoint.sh", "postgres"]
    environment:
      POSTGRES_DB: weather
    ports:
      - target: 5432
        published: 5432
        protocol: tcp
        mode: host
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/environment:/etc/host-environment:ro
      - ./_common/map-env.sh:/map-env.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  timescaledb-data:
    name: timescaledb-data

networks:
  default:
    external: true
    name: share-net
