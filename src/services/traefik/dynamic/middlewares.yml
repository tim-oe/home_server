# Applied at the websecure entrypoint (traefik.yml). Do not also point docker
# routers at lan-only@file: Traefik drops the route if the file provider has not
# loaded yet. vaultwarden, prometheus, unifi-os, and forgejo keep the same CIDRs as
# labels on the app container (must-never-be-public marker).
http:
  middlewares:
    lan-only:
      ipAllowList:
        sourceRange:
          - 192.168.1.0/24
          - 10.9.0.0/24
