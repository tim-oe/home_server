# Static config. TLS for every router is set on the websecure and public
# entrypoints, so service labels do not need certResolver or tls=true.
# https://doc.traefik.io/traefik/v3.7/
log:
  level: INFO

accessLog:
  format: json
  fields:
    headers:
      defaultMode: drop
      names:
        User-Agent: keep
        CF-Connecting-IP: keep

global:
  checkNewVersion: false
  sendAnonymousUsage: false

api:
  dashboard: true
  insecure: false

# /ping and /metrics share the unpublished metrics entrypoint (:8082).
# Prometheus scrapes it over share-net; the compose healthcheck uses /ping.
ping:
  entryPoint: metrics

metrics:
  prometheus:
    entryPoint: metrics
    addEntryPointsLabels: true
    addRoutersLabels: true
    addServicesLabels: true

entryPoints:
  web:
    address: ":80"
    http:
      aliasHeadersStrategy: delete
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"
    http:
      aliasHeadersStrategy: delete
      middlewares:
        - lan-only@file
      tls:
        certResolver: cloudflare
        domains:
          - main: tecronin.uk
            sans:
              - "*.tecronin.uk"
  # Internet-facing. OPNsense forwards WAN:443 here. Routers must opt in with
  # entrypoints=websecure,public, so a new service is not public by accident.
  public:
    address: ":8443"
    # https://www.cloudflare.com/ips-v4 — the same list the OPNsense alias fetches.
    # Static here because Traefik cannot load it from a URL; it changes rarely.
    forwardedHeaders:
      trustedIPs:
        - 173.245.48.0/20
        - 103.21.244.0/22
        - 103.22.200.0/22
        - 103.31.4.0/22
        - 141.101.64.0/18
        - 108.162.192.0/18
        - 190.93.240.0/20
        - 188.114.96.0/20
        - 197.234.240.0/22
        - 198.41.128.0/17
        - 162.158.0.0/15
        - 104.16.0.0/13
        - 104.24.0.0/14
        - 172.64.0.0/13
        - 131.0.72.0/22
    http:
      aliasHeadersStrategy: delete
      tls:
        certResolver: cloudflare
        domains:
          - main: tecronin.uk
            sans:
              - "*.tecronin.uk"
  metrics:
    address: ":8082"
    http:
      aliasHeadersStrategy: delete

certificatesResolvers:
  cloudflare:
    acme:
      email: tecronin@gmail.com
      storage: /letsencrypt/acme.json
      dnsChallenge:
        provider: cloudflare
        propagation:
          delayBeforeChecks: 15s

providers:
  docker:
    endpoint: unix:///var/run/docker.sock
    exposedByDefault: false
    network: share-net
    # Keep routers for containers whose Docker healthcheck is still
    # starting/unhealthy (unifi-os start_period is 15m). Without this Traefik
    # drops the route and the browser gets a 19-byte 404 until healthy.
    allowEmptyServices: true
  file:
    directory: /dynamic
    watch: true
