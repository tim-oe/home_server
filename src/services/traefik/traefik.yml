# Static config. TLS for every router is set on the websecure entrypoint, so
# service labels do not need certResolver or tls=true.
# https://doc.traefik.io/traefik/v3.7/
log:
  level: INFO

global:
  checkNewVersion: false
  sendAnonymousUsage: false

api:
  dashboard: true
  insecure: false

# /ping and /metrics share the unpublished metrics entrypoint (:8082).
# Prometheus scrapes it over share-net; the compose healthcheck uses /ping.
ping:
  entryPoint: metrics

metrics:
  prometheus:
    entryPoint: metrics
    addEntryPointsLabels: true
    addRoutersLabels: true
    addServicesLabels: true

entryPoints:
  web:
    address: ":80"
    http:
      aliasHeadersStrategy: delete
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"
    http:
      aliasHeadersStrategy: delete
      tls:
        certResolver: cloudflare
        domains:
          - main: tecronin.uk
            sans:
              - "*.tecronin.uk"
  metrics:
    address: ":8082"
    http:
      aliasHeadersStrategy: delete

certificatesResolvers:
  cloudflare:
    acme:
      email: tecronin@gmail.com
      storage: /letsencrypt/acme.json
      dnsChallenge:
        provider: cloudflare
        propagation:
          delayBeforeChecks: 15s

providers:
  docker:
    endpoint: unix:///var/run/docker.sock
    exposedByDefault: false
    network: share-net
  file:
    directory: /dynamic
    watch: true
