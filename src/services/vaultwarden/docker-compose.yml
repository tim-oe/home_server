# https://hub.docker.com/r/vaultwarden/server
# https://github.com/vineethmn/vaultwarden-docker-compose
# https://github.com/dani-garcia/vaultwarden/wiki/SMTP-Configuration#googlegmail
# https://github.com/dani-garcia/vaultwarden/wiki/Enabling-admin-page#secure-the-admin_token
# https://community.bitwarden.com/t/cant-download-attachements-from-self-hosted-bitwarden/30136/2
# https://github.com/Haxxnet/Compose-Examples/blob/main/examples/vaultwarden/docker-compose.yml
---
services:
  vaultwarden:
    image: vaultwarden/server:1.37.2
    container_name: vaultwarden
    hostname: vaultwarden
    networks:
      - default
    restart: unless-stopped
    ports:
     # base port needs to map to rocket port   
     - 8860:8860
    volumes:
      - vaultwarden-storage:/data:rw
      # sync local TZ and time
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    environment:
      - ROCKET_PORT=8860
      - ADMIN_TOKEN=${ADMIN_TOKEN}
      - WEBSOCKET_ENABLED=true
      - SIGNUPS_ALLOWED=false
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_FROM=${SMTP_FROM}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_SECURITY=${SMTP_SECURITY}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - DOMAIN=${DOMAIN}
      # configs
      - globalSettings__attachment__baseDirectory=/data/attachments
      - globalSettings__attachment__baseUrl=https://vaultwarden.tecronin.uk/attachments
      - globalSettings__send__baseDirectory=/data/attachments/send
      - globalSettings__send__baseUrl=https://vaultwarden.tecronin.uk/attachments/send
    labels:
      # for offen backup
      - docker-volume-backup.stop-during-backup=true
      - traefik.enable=true
      - traefik.http.routers.vaultwarden.rule=Host(`vaultwarden.tecronin.uk`)
      - traefik.http.routers.vaultwarden.entrypoints=websecure
      - traefik.http.routers.vaultwarden.middlewares=lan-only@file
      - traefik.http.services.vaultwarden.loadbalancer.server.port=8860
  backup:
    # https://github.com/offen/docker-volume-backup/
    image: offen/docker-volume-backup:v2.48.2
    container_name: vaultwarden-backup
    restart: always
    environment:
      EXEC_LABEL: vaultwarden
      BACKUP_CRON_EXPRESSION: "5 01 * * *"
      BACKUP_FILENAME: backup-%Y-%m-%dT%H-%M-%S.tar.gz
      BACKUP_PRUNING_PREFIX: backup-
      BACKUP_RETENTION_DAYS: 7
    volumes:
      # force local TZ to avoid chron math
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - vaultwarden-storage:/backup:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /mnt/backup/docker/vaultwarden:/archive
  gdrive:
    image: rclone/rclone:1.75.0
    container_name: vaultwarden-gdrive
    restart: unless-stopped
    # alpine busybox sleep has no infinity; idle until offen execs prune-post
    entrypoint: ["tail", "-f", "/dev/null"]
    env_file:
      - path: /etc/environment
        required: false
    environment:
      PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      RCLONE_SRC: /archive
      RCLONE_DEST: gdrive:/backup/services/vault
      GOTIFY_URL: http://gotify
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - /root/.config/rclone/rclone.conf:/config/rclone/rclone.conf:ro
      - /mnt/backup/docker/vaultwarden:/archive:ro
      - ./_common/rclone-sync.sh:/rclone-sync.sh:ro
    labels:
      - docker-volume-backup.exec-label=vaultwarden
      - docker-volume-backup.prune-post=/bin/sh /rclone-sync.sh
      - diun.enable=false
volumes:
  vaultwarden-storage:
    name: vaultwarden-storage
networks:
  default:
    external: true
    name: share-net
