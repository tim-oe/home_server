# Provisioning the policy tree replaces the whole tree (Grafana default email
# included). Default contact point is the Gotify webhook.
apiVersion: 1
policies:
  - orgId: 1
    receiver: gotify
    group_by:
      - grafana_folder
      - alertname
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
