# Restic backup of /mnt/backup/work to the EST_BACKUP_* S3 bucket on a schedule.
# Named stack.yml so Compose does not auto-select it ahead of docker-compose.yml.
# That file includes this one with env_file /etc/environment so ${EST_BACKUP_SRC}
# is the host path. Credentials are read from the mounted file because crond
# does not pass env_file into jobs.
---
services:
  s3sync:
    image: restic/restic:0.19.1
    container_name: s3sync
    hostname: s3sync
    restart: unless-stopped
    entrypoint: ["/usr/sbin/crond", "-f", "-d", "8"]
    env_file:
      - path: /etc/environment
        required: false
    environment:
      PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      GOTIFY_URL: http://gotify
      QUIET_MINUTES: "30"
      RESTIC_CACHE_DIR: /cache
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      # crond does not pass Docker env into jobs; s3-push.sh reads secrets here.
      - /etc/environment:/etc/host-environment:ro
      - type: bind
        source: ${EST_BACKUP_SRC:-/mnt/backup/work}
        target: /data
        read_only: true
        bind:
          propagation: rslave
      - s3sync-cache:/cache
      - ./_common/gotify-notify.sh:/gotify-notify.sh:ro
      - ./s3-push.sh:/s3-push.sh:ro
      - ./filters.txt:/filters.txt:ro
      - ./crontab:/etc/crontabs/root:ro
  backrest:
    image: garethgeorge/backrest:v1.14.1
    container_name: backrest
    hostname: backrest
    restart: unless-stopped
    entrypoint: ["/sbin/tini", "--", "/bin/sh", "/backrest-env.sh"]
    command: ["/backrest"]
    env_file:
      - path: /etc/environment
        required: false
    environment:
      BACKREST_DATA: /var/lib/backrest
      BACKREST_CONFIG: /config/config.json
      BACKREST_PORT: 0.0.0.0:9898
      XDG_CACHE_HOME: /cache
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/environment:/etc/host-environment:ro
      - backrest-config:/config
      - backrest-data:/var/lib/backrest
      - backrest-cache:/cache
      # Recovered files land on the host. Snapshot paths start at /data.
      - /mnt/backup/restore:/restore
      - ./backrest-env.sh:/backrest-env.sh:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.backrest.rule=Host(`backrest.tecronin.uk`)
      - traefik.http.routers.backrest.entrypoints=websecure
      - traefik.http.middlewares.backrest-lan.ipallowlist.sourcerange=192.168.1.0/24,10.9.0.0/24
      - traefik.http.routers.backrest.middlewares=backrest-lan
      - traefik.http.services.backrest.loadbalancer.server.port=9898
volumes:
  s3sync-cache:
  backrest-config:
  backrest-data:
  backrest-cache:
networks:
  default:
    external: true
    name: share-net
