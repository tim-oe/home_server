# postgresql.service is a no-op; wait for the real cluster before vendor pre-start.
# TimeoutStartSec covers the slow overlay2 chown in the vendor hook.
[Unit]
After=postgresql@14-main.service
Wants=postgresql@14-main.service

[Service]
TimeoutStartSec=15min
ExecStartPre=
ExecStartPre=/bin/bash /usr/local/bin/unifi-core-wait-postgres
ExecStartPre=/usr/share/unifi-core/app/hooks/pre-start
