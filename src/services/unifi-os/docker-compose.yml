# https://github.com/lemker/unifi-os-server
# https://github.com/lemker/unifi-os-server/blob/main/docker-compose.yaml
# replaces the EOL jacobalberty/unifi image, see ../unifi/
---
services:
  unifi-os-server:
    # TODO investigate images that tag UniFi OS Server itself (e.g. giiibates/unifi-os-server:5.1.37).
    # lemker v1.x is their wrapper SemVer, not Network and not upstream UOS. Auto-update is UniFi OS,
    # not the image; keep it off or Network still drifts on any of these.
    image: ghcr.io/lemker/unifi-os-server:v1.5.1
    container_name: unifi-os-server
    hostname: unifi.localdomain
    restart: unless-stopped
    # host reboot / docker stop default is 10s; that SIGKILLs postgres mid-shutdown
    stop_grace_period: 2m
    # systemd services (unifi-core) time out without this; cgroup: host alone is not enough
    privileged: true
    # every UniFi OS component runs as a systemd service, which needs the host cgroup
    cgroup: host
    cap_add:
      - NET_RAW
      - NET_ADMIN
    extra_hosts:
      host.docker.internal: host-gateway
    tmpfs:
      - /run:exec
      - /run/lock
      - /tmp:exec
      - /var/lib/journal
      - /var/opt/unifi/tmp:size=64m
    environment:
      # inform address handed to adopted devices, must be reachable from the 192.168.1.0/24 LAN
      - UOS_SYSTEM_IP=${UOS_SYSTEM_IP}
      - TZ=America/Chicago
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - unifi-os-persistent:/persistent
      - unifi-os-data:/data
      - unifi-os-srv:/srv
      - unifi-os-var-log:/var/log
      - unifi-os-unifi:/var/lib/unifi
      - unifi-os-mongodb:/var/lib/mongodb
      - unifi-os-rabbitmq-ssl:/etc/rabbitmq/ssl
      # parent dir already exists in the image (cap.conf, memory.conf)
      - ./unifi-core-timeout.conf:/lib/systemd/system/unifi-core.service.d/timeout.conf:ro
      - ./unifi-core-wait-postgres:/usr/local/bin/unifi-core-wait-postgres:ro
      # privileged systemd claims host TTYs otherwise (login prompt becomes uos-server)
      # https://github.com/lemker/unifi-os-server/issues/58
      - /dev/null:/etc/systemd/system/getty@.service:ro
      - /dev/null:/etc/systemd/system/serial-getty@.service:ro
      - /dev/null:/etc/systemd/system/console-getty.service:ro
      - /dev/null:/etc/systemd/system/container-getty@.service:ro
      - /dev/null:/etc/systemd/system/autovt@.service:ro
      # force local TZ to avoid chron math
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "11443:443/tcp"
      - "8080:8080/tcp"
      - "3478:3478/udp"
      - "10003:10003/udp"
      # APs still inform on the old controller port; remove after set-inform to :8080
      - "8882:8080/tcp"
    networks:
      default:
        aliases:
          # share-net alias (legacy nginx name; Traefik uses docker labels)
          - unifi.localdomain
    labels:
      # for offen backup, mongodb cannot be safely hot copied
      - docker-volume-backup.stop-during-backup=true
      - traefik.enable=true
      - traefik.http.routers.unifi-os.rule=Host(`unifi.tecronin.uk`)
      - traefik.http.routers.unifi-os.entrypoints=websecure
      - traefik.http.routers.unifi-os.middlewares=lan-only@file
      - traefik.http.services.unifi-os.loadbalancer.server.port=443
      - traefik.http.services.unifi-os.loadbalancer.server.scheme=https
      - traefik.http.services.unifi-os.loadbalancer.serverstransport=unifi@file
    # container "Up" is systemd only; use: docker compose up -d --wait --wait-timeout 900
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -q -p 5432 && systemctl is-active --quiet unifi-core && systemctl is-active --quiet unifi && systemctl is-active --quiet ulp-go",
        ]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 15m
  backup:
    # https://github.com/offen/docker-volume-backup/
    image: offen/docker-volume-backup:v2.48.2
    container_name: unifi-os-backup
    restart: always
    environment:
      EXEC_LABEL: unifi-os
      BACKUP_CRON_EXPRESSION: "15 01 * * *"
      BACKUP_FILENAME: backup-%Y-%m-%dT%H-%M-%S.tar.gz
      BACKUP_PRUNING_PREFIX: backup-
      BACKUP_RETENTION_DAYS: 7
    volumes:
      # force local TZ to avoid chron math
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - unifi-os-persistent:/backup/persistent:ro
      - unifi-os-data:/backup/data:ro
      - unifi-os-srv:/backup/srv:ro
      - unifi-os-unifi:/backup/var-lib-unifi:ro
      - unifi-os-mongodb:/backup/var-lib-mongodb:ro
      - unifi-os-rabbitmq-ssl:/backup/rabbitmq-ssl:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /mnt/backup/docker/unifi-os:/archive
    labels:
      - diun.enable=false
  gdrive:
    image: rclone/rclone:1.75.0
    container_name: unifi-os-gdrive
    restart: unless-stopped
    # alpine busybox sleep has no infinity; idle until offen execs prune-post
    entrypoint: ["tail", "-f", "/dev/null"]
    env_file:
      - path: /etc/environment
        required: false
    environment:
      PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      RCLONE_SRC: /archive
      RCLONE_DEST: gdrive:/backup/services/unifi-os
      GOTIFY_URL: http://gotify
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - /root/.config/rclone/rclone.conf:/config/rclone/rclone.conf:ro
      - /mnt/backup/docker/unifi-os:/archive:ro
      - ./_common/rclone-sync.sh:/rclone-sync.sh:ro
    labels:
      - docker-volume-backup.exec-label=unifi-os
      - docker-volume-backup.prune-post=/bin/sh /rclone-sync.sh
      - diun.enable=false
volumes:
  unifi-os-persistent:
    name: unifi-os-persistent
  unifi-os-data:
    name: unifi-os-data
  unifi-os-srv:
    name: unifi-os-srv
  unifi-os-var-log:
    name: unifi-os-var-log
  unifi-os-unifi:
    name: unifi-os-unifi
  unifi-os-mongodb:
    name: unifi-os-mongodb
  unifi-os-rabbitmq-ssl:
    name: unifi-os-rabbitmq-ssl
networks:
  default:
    external: true
    name: "share-net"
