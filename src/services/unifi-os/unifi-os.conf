server {
    listen 443 ssl;
    server_name unifi.tecronin.uk;

    # Allow both local and VPN networks
    allow 192.168.1.0/24;
    allow 10.9.0.0/24;
    deny all;

    # .unf restore uploads are large
    client_max_body_size 1G;

    location / {
        # Use variable to force re-resolution
        set $upstream unifi.localdomain;

        proxy_pass https://$upstream;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # UniFi OS UI needs WebSocket upgrade ($connection_upgrade is in nginx.conf)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Timeouts and retries — restore can sit for several minutes
        proxy_connect_timeout 2s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;
        proxy_next_upstream_tries 1;
        proxy_next_upstream_timeout 2s;

        # Stream the UI and large backup uploads
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
