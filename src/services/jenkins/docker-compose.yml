# https://www.jenkins.io/projects/gsoc/2023/project-ideas/docker-compose-build/
# https://hub.docker.com/r/jenkins/jenkins
---
services:
  jenkins:
    image: "jenkins/jenkins:2.568.2-lts"
    container_name: "jenkins"
    hostname: "jenkins"
    restart: "unless-stopped"
    privileged: true
    user: "root"
    environment:
      - "JENKINS_OPTS=--httpPort=8080"
    ports:
      - target: 8080
        # host 8080 reserved for UniFi OS Server inform; Traefik uses share-net :8080
        published: 8088
        protocol: tcp
        mode: host    
      - target: 50000
        published: 50000
        protocol: tcp
        mode: host    
    volumes:
      - "jenkins-home:/var/jenkins_home"
      # sync local TZ and time
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    labels:
      - 'diun.include_tags=^\d+\.\d+\.\d+-lts$$'
      - traefik.enable=true
      - traefik.http.routers.jenkins.rule=Host(`jenkins.tecronin.uk`)
      - traefik.http.routers.jenkins.entrypoints=websecure
      - traefik.http.services.jenkins.loadbalancer.server.port=8080
volumes:
  jenkins-home:
    name: jenkins-home  
networks:
  default:
    external: true
    name: "share-net"
